<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCLAL的书影游记录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <button id="themeToggle" class="theme-toggle" title="切换深色 / 浅色">🌙</button>
      <h1>MCLAL的书影游记录</h1>
      <p class="subtitle">游戏 · 影视 · 书籍</p>
    </div>
  </header>

  <main class="wrap">
    <nav id="tabs" class="tabs"></nav>
    <nav id="yearTabs" class="year-tabs"></nav>

    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索标题或评价…">
      <select id="filter"></select>
      <select id="sort">
        <option value="date_desc">时间（新→旧）</option>
        <option value="date_asc">时间（旧→新）</option>
        <option value="rating_desc">评分（高→低）</option>
        <option value="rating_asc">评分（低→高）</option>
        <option value="title">标题（A→Z）</option>
      </select>
      <button id="adminBtn" class="admin-tab">🔧 管理</button>
    </div>

    <div id="adminBar" class="admin-bar" hidden>
      <span class="admin-tag">管理模式</span>
      <button id="addEntryBtn" class="btn">＋ 添加记录</button>
      <button id="boardBtn" class="btn ghost">板块管理</button>
      <button id="exportBtn" class="btn ghost">导出备份</button>
      <button id="tokenBtn" class="btn ghost">设置令牌</button>
      <button id="exitAdmin" class="btn ghost">退出管理</button>
    </div>

    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>
      这里还没有记录。进入「管理」模式，点「＋ 添加记录」开始吧。
    </div>
  </main>

  <footer class="site-footer">
    数据默认保存在你本机浏览器中。接入云端后，分享链接也会实时更新。
  </footer>

  <!-- 详情弹窗 -->
  <div id="detailModal" class="modal" hidden>
    <div class="modal-box">
      <div id="detailCover" class="detail-cover"></div>
      <h3 id="detailTitle" class="detail-title"></h3>
      <div class="detail-meta" id="detailMeta"></div>
      <div class="detail-review" id="detailReview"></div>
      <div class="modal-actions" id="detailActions" hidden>
        <button id="detailEdit" class="btn ghost">编辑</button>
        <button id="detailDelete" class="btn ghost">删除</button>
      </div>
      <div class="modal-actions">
        <button id="detailClose" class="btn">关闭</button>
      </div>
    </div>
  </div>

  <!-- 记录编辑弹窗 -->
  <div id="entryModal" class="modal" hidden>
    <div class="modal-box">
      <h3 id="entryModalTitle">添加记录</h3>
      <label>标题<input id="f-title" type="text" placeholder="必填"></label>
      <label>年份
        <select id="f-year"></select>
        <input id="f-year-new" type="text" placeholder="或输入新年份，如 2024" style="margin-top:8px">
      </label>
      <label>状态<select id="f-status"></select></label>
      <label>分类（平台）
        <select id="f-category">
          <option value="">无</option>
          <option value="PS">PS</option>
          <option value="NS">NS</option>
          <option value="PC">PC</option>
        </select>
      </label>
      <label>评分（1–10，可含 .5）<input id="f-rating" type="number" min="1" max="10" step="0.5"></label>
      <label>日期<input id="f-date" type="date"></label>
      <label>封面图链接<input id="f-cover" type="text" placeholder="留空则用占位图标"></label>
      <label>评价<textarea id="f-review" rows="4" placeholder="写点什么…"></textarea></label>
      <div class="modal-actions">
        <button id="entryCancel" class="btn ghost">取消</button>
        <button id="entrySave" class="btn">保存</button>
      </div>
    </div>
  </div>

  <!-- 板块管理弹窗 -->
  <div id="boardModal" class="modal" hidden>
    <div class="modal-box">
      <h3>板块管理</h3>
      <div id="boardList" class="board-list"></div>
      <hr>
      <h4 id="boardFormTitle">新增板块</h4>
      <label>板块名称<input id="b-name" type="text" placeholder="如：音乐"></label>
      <label>图标（emoji）<input id="b-emoji" type="text" maxlength="4" placeholder="如：🎵"></label>
      <label>状态项（逗号分隔）<input id="b-statuses" type="text" placeholder="待看,看了,在看"></label>
      <label>年份（逗号分隔，可改可加）<input id="b-years" type="text" placeholder="2026,2025,2024"></label>
      <div class="modal-actions">
        <button id="boardCancel" class="btn ghost">关闭</button>
        <button id="boardSave" class="btn">保存板块</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
